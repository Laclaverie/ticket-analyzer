name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install workspace dependencies
        run: uv sync --all-packages

      - name: Run domain-models tests
        run: uv run --package domain-models pytest packages/domain-models/tests -v

      - name: Run taxonomy-core tests
        run: uv run --package taxonomy-core pytest packages/taxonomy-core/tests -v

      - name: Run persistence tests
        run: uv run --package persistence pytest packages/persistence/tests -v

      - name: Run api-service tests
        run: uv run --package api-service pytest apps/api-service/tests -v

      - name: Run worker-service tests
        run: uv run --package worker-service pytest apps/worker-service/tests -v
