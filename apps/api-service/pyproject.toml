[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "api-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.0",
    "domain-models",
    "persistence",
]

[tool.hatch.build.targets.wheel]
packages = ["src/api_service"]

[tool.uv.sources]
domain-models = { workspace = true }
persistence = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
