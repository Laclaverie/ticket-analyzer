[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "worker-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.0",
    "domain-models",
    "parsing-core",
    "persistence",
    "taxonomy-core",
    "opencv-python-headless>=4.13.0.92",
    "pillow>=12.2.0",
    "ultralytics>=8.4.67",
    "numpy>=2.4.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/worker_service"]

[tool.uv.sources]
domain-models = { workspace = true }
parsing-core = { workspace = true }
persistence = { workspace = true }
taxonomy-core = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
