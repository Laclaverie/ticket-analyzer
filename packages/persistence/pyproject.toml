[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "persistence"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "domain-models",
]

[tool.hatch.build.targets.wheel]
packages = ["src/persistence"]

[tool.uv.sources]
domain-models = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
